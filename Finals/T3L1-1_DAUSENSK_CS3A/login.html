<div class="dropdown position-fixed bottom-0 end-0 bd-mode-toggle">
    <button class="btn btn-bd-primary dropdown-toggle d-flex align-items-center"
        id="bd-theme"
        type="button"
        aria-expanded="false"
        data-bs-toggle="dropdown"
        aria-label="Toggle theme (auto)">
        <svg class="bi my-1 theme-icon-active" width="1em" height="1em"><use href="#circle-half"></use></svg>
        <span class="visually-hidden" id="bd-theme-text">Toggle theme</span>            
    </button>
    <ul class="dropdown-menu dropdown-menu-end shadow">
        <li>
            <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="light" aria-pressed="false">
                <svg class="bi me-2 opacity-50" width="1em" height="1em"><use href="#sun-fill"></use></svg>
                Light
                <svg class="bi ms-auto d-none" width="1em" height="1em"><use href="#check2"></use></svg>
            </button>
        </li>
        <li>
            <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark" aria-pressed="false">
            <svg class="bi me-2 opacity-50" width="1em" height="1em"><use href="#moon-stars-fill"></use></svg>

        <li>

                Auto

        </li>
    </ul>
</div>

<!-- Main -->
<main>
    <!-- Logo for website -->
    <div class="logo-container">
        <img src="assets/name_stroke.png" alt="socialSphere">
    </div>
    <!-- container for the page contents -->
    <div class="container" id="container">
        <!-- container for the sign-up form -->

                      </svg></a>
                </div>
                <span>or use your email for registration</span>
                <input type="text" placeholder="Username" id="regUsername">
                <input type="email" placeholder="Email" id="regEmail">
                <input type="password" placeholder="Password" id="regPassword">
                <!-- button to activiate the signup function in js -->
                <button type="button" onclick="signup()">Sign Up</button>
            </form>
        </div>

        <!-- container for the sign-in form -->
        <div class="form-container sign-in">
            <form action="#">
                <h1>Sign In</h1>
                <!-- Social Icons -->
                <div class="social-icons">

                        <path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951"/>

                      </svg></a>
                </div>
                <span>or use your email and password</span>
                <input type="email" placeholder="Email" id="email">
                <input type="password" placeholder="Password" id="password">
                <a href="#">Forgot your password?</a>
                <!-- button to activate the login function in js -->
                <button type="button" onclick="login()">Sign In</button>
            </form>
        </div>

        <!-- container for the toggles -->
        <div class="toggle-container">
            <div class="toggle">
                <!-- left side toggle -->
                <div class="toggle-panel toggle-left">
                    <h1>Welcome Back!</h1>
                    <p>Already have an account? <br>
                    Click here to sign in!</p>
                    <button type="button" class="hidden" id="login">Sign In</button>
                </div>

                <!-- right side toggle -->
                <div class="toggle-panel toggle-right">
                    <h1>Hello!</h1>
                    <p>Don't have an account yet? <br>
                    Click here to register!</p>
                    <button type="button" class="hidden" id="register">Sign Up</button>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- javaScript -->
<script src="js/script.js"></script>
   
</body>
</html>
